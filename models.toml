# Which model takes which role. `bin/role <role>` evaluates it; skills run that,
# and the Bash hook's codex_credits check reads active_families / [cli.*] from it.
# models.md explains the choices. When models change, edit only this file.
# A project overrides the reviewer in docs/agents/checks.md, under Review.
#
# A role lists choices in order. The first choice whose conditions hold wins:
#   when.limit      remaining share of a quota, in percent, at least this value
#   when.not_family the choice must not be of the implementer's family
#   only_families   the role never goes to other families
#   forbid_models   models that must never appear in this role's choices
# A choice may carry `note`, shown to the person reading the plan.

schema = 1
active_families = ["anthropic", "google"]

[models.neon]
id = "gemini-4-neon"
family = "google"
cli = "antigravity"
tier = "frontier"

[models.opus]
id = "claude-opus-5-5"
family = "anthropic"
cli = "claude"
tier = "strong"

[models.carbon]
id = "gemini-4-carbon"
family = "google"
cli = "antigravity"
tier = "frontier"

[models.fable]
id = "claude-fable-5-2"
family = "anthropic"
cli = "claude"
tier = "frontier"

[models.sonnet]
id = "claude-sonnet-5-5"
family = "anthropic"
cli = "claude"
tier = "routine"

[models.argon]
id = "gemini-4-argon"
family = "google"
cli = "antigravity"
tier = "strong"

[models.flash]
id = "gemini-3.8-flash"
family = "google"
cli = "antigravity"
tier = "routine"

# How to run a model headless or via delegation. {id} and {effort} are substituted.
# `option` is the provider-specific reasoning/effort parameter name.
[cli.claude]
option = "effort"
run = ["claude", "-p", "--model", "{id}", "--effort", "{effort}"]
review = ["claude", "-p", "--model", "{id}", "--effort", "{effort}"]

[cli.antigravity]
option = "thought_level"
delegate_tool = "delegate_task"

# Provider-specific option names, prompt-cache windows and context budgets for warm-vs-fresh reuse.
[providers.anthropic]
option = "effort"
cache_ttl_minutes = 60
subagent_cache_ttl_minutes = 5
warm_idle_minutes = 50
compact_window_tokens = 500000
warm_context_tokens = 200000
reset_context_tokens = 150000
max_turns_before_handoff = 80

[providers.google]
option = "thought_level"
cache_ttl_minutes = 60
subagent_cache_ttl_minutes = 60
warm_idle_minutes = 50
compact_window_tokens = 1000000
warm_context_tokens = 250000
reset_context_tokens = 185000
max_turns_before_handoff = 80

[roles.implement]
purpose = "structural, architectural, and regular code against a spec or ticket contract"
choices = [
  { model = "neon", effort = "medium" },
  { model = "opus", effort = "medium" },
  { model = "argon", effort = "medium" },
]

[roles.visual]
purpose = "UI, layout, styling, and anything judged visually"
only_families = ["anthropic", "google"]
choices = [
  { model = "opus", effort = "high" },
  { model = "neon", effort = "high" },
]

[roles.review]
purpose = "independent blind review of finished work"
choices = [
  { model = "carbon", effort = "medium", when = { not_family = true } },
  { model = "fable", effort = "high", when = { not_family = true } },
  { model = "carbon", effort = "medium", note = "same family as the implementer: fresh context only, say so in the report" },
  { model = "fable", effort = "high", note = "same family as the implementer: fresh context only, say so in the report" },
]

[roles.critique]
purpose = "challenging plans, trade-offs, and architectural proposals without executing them"
choices = [
  { model = "carbon", effort = "high" },
  { model = "fable", effort = "high" },
]

[roles.specify]
purpose = "specs, pre-lane Specifier notes, and mid-flight Advisor calls"
choices = [
  { model = "carbon", effort = "high" },
  { model = "fable", effort = "high" },
]

[roles.design]
purpose = "interface design, architecture synthesis, and judgment calls (alias-compatible with specify)"
choices = [
  { model = "carbon", effort = "high" },
  { model = "fable", effort = "high" },
]

[roles.audit]
purpose = "security, correctness, test, friction, and orchestration audits"
choices = [
  { model = "carbon", effort = "high" },
  { model = "fable", effort = "high" },
]

[roles.scout]
purpose = "read-only repository mapping, call-site discovery, and doc/changelog verification"
forbid_models = ["opus", "neon", "fable", "carbon"]
choices = [
  { model = "sonnet", effort = "medium" },
  { model = "flash", effort = "medium" },
]

[roles.routine]
purpose = "token-heavy, low-risk mechanical edits, renames, running checks, and doc mirroring"
forbid_models = ["opus", "neon", "fable", "carbon"]
choices = [
  { model = "sonnet", effort = "medium" },
  { model = "argon", effort = "medium" },
  { model = "flash", effort = "medium" },
]

[roles.research]
purpose = "reading docs and primary sources, collecting facts and release notes"
forbid_models = ["opus", "neon", "fable", "carbon"]
choices = [
  { model = "argon", effort = "medium" },
  { model = "sonnet", effort = "medium", note = "plain reading and grep only" },
  { model = "flash", effort = "medium", note = "plain reading and grep only" },
]

# Relative price weights read by `tokenfather` (tokenfather/pricing.py).
# `cache_write_short` / `cache_write_long` map to providers with tiered cache-write TTLs
# (e.g. Anthropic 5m / 1h); providers with implicit or automatic caching (Google)
# use `cache_write_default = 1.0`. `tier_multiplier` scales weighted units across tiers.
[pricing.default]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write_short = 1.25
cache_write_long = 2.0
cache_write_default = 1.0
tier_multiplier = 1.0

[pricing.fable]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write_short = 1.25
cache_write_long = 2.0
cache_write_default = 1.25
tier_multiplier = 1.0

